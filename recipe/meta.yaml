{% set name = "beniget" %}
{% set version = "0.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 976d40c6f22650d133b00291e6fe3ab8e9850a83ba121d834ea5c74db7f66c0d

build:
  number: 0
  skip: true  # [py<36]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - gast >=0.7.0

test:
  source_files:
    - tests
    - README.rst
  imports:
    - beniget
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/serge-sans-paille/beniget
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Extract semantic information about static Python code
  description: |
    Beniget is a collection of Compile-time analyze on Python Abstract Syntax Tree(AST).
    It's a building block to write static analyzer or compiler for Python.
  dev_url: https://github.com/serge-sans-paille/beniget
  doc_url: https://github.com/serge-sans-paille/beniget

extra:
  recipe-maintainers:
    - CyrilleBonamy
    - paugier
    - serge-sans-paille
